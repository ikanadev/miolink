# Runs miolink: the web client on port 3000 and the API on port 3001. A
# reverse proxy (Caddy) in front terminates TLS and routes to these ports.
#
#   cp .env.example .env   # fill in MIOLINK_API_KEY_HASH and MIOLINK_CORS_ORIGINS
#   docker compose up -d --build
#
# `docker compose down` keeps the data volume; `down -v` deletes it.
name: miolink

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  miobackend:
    <<: *hardening
    build: ./miobackend
    image: miolink/miobackend:latest
    ports:
      - "${MIOLINK_BIND_ADDR:-127.0.0.1}:3001:8080"
    environment:
      MIOLINK_API_KEY_HASH: ${MIOLINK_API_KEY_HASH:?set MIOLINK_API_KEY_HASH in .env (run ./keygen.sh)}
      MIOLINK_CORS_ORIGINS: ${MIOLINK_CORS_ORIGINS:-}
    volumes:
      - data:/data
    tmpfs:
      - /tmp
    stop_grace_period: 15s

  mioweb:
    <<: *hardening
    build: ./mioweb
    image: miolink/mioweb:latest
    ports:
      - "${MIOLINK_BIND_ADDR:-127.0.0.1}:3000:8080"
    # nginx writes its pid and temp files here; the image is otherwise read-only.
    tmpfs:
      - /tmp
      - /var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  data:
