version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: miobackend/gen
    - file_option: java_package_prefix
      value: dev.ikana.miolink.gen
plugins:
  # Golang
  - local: [go, tool, protoc-gen-go]
    out: miobackend/gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: miobackend/gen
    opt:
      - paths=source_relative
      - simple
  # Android. Plugin versions must match the runtime libraries in
  # mioandroid/gradle/libs.versions.toml: protoc v36.2 <-> protobuf 4.36.2,
  # connect-kotlin v0.9.0 <-> connect-kotlin 0.9.0.
  - remote: buf.build/protocolbuffers/java:v36.2
    out: mioandroid/gen/src/main/java
    opt: lite
  - remote: buf.build/protocolbuffers/kotlin:v36.2
    out: mioandroid/gen/src/main/java
    opt: lite
  - remote: buf.build/connectrpc/kotlin:v0.9.0
    out: mioandroid/gen/src/main/java
    opt: generateCoroutineMethods=true
